<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Badge Sanitario</title>
    <link rel="icon" type="image/x-icon" href="https://webapp.drgiuseppemusumeci.com/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.1.0/dist/bwip-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex items-center justify-center p-4">

    <main class="w-full max-w-md flex flex-col gap-6">
        
        <section class="bg-white p-6 rounded-3xl shadow-md border border-slate-200">
            <div class="flex items-center gap-3 mb-4">
                <div class="bg-teal-100 text-teal-700 p-2 rounded-xl text-xl">🪪</div>
                <h1 class="text-xl font-bold text-slate-800">Generatore Badge</h1>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="input-codice" placeholder="Codice Operatore..." class="flex-1 px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-600 outline-none transition">
                <button id="btn-cerca" class="bg-teal-700 hover:bg-teal-800 text-white font-medium px-4 py-2 rounded-xl transition shadow">Cerca</button>
            </div>
            <p id="search-status" class="text-sm mt-3 font-medium text-center hidden"></p>
        </section>

        <section id="badge-section" class="hidden flex flex-col gap-4">
            
            <div id="badge-card-export" class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-200 mx-auto w-full max-w-sm">
   <div id="badge-card-export" class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-200 mx-auto w-full max-w-sm">
    <div class="bg-teal-800 p-6 text-white text-center flex flex-col items-center">
        <div class="mb-2">
            <img class="h-11 w-auto object-contain drop-shadow-md" src="https://webapp.drgiuseppemusumeci.com/favicon.ico" alt="Logo">
        </div>
        <h2 class="font-bold text-xl tracking-tight">HealthCare Portal</h2>
        <p class="text-teal-200 text-xs uppercase tracking-widest mt-1">Identificativo Personale</p>
    </div>

                
                <div class="p-6 space-y-5">
                    <div class="text-center">
                        <div id="badge-nome" class="text-2xl font-black text-slate-900 leading-tight">Nome Cognome</div>
                        <div id="badge-mansione" class="text-slate-500 font-medium text-sm mt-1">Mansione</div>
                    </div>
                    
                    <div class="flex justify-between items-center text-sm border-t border-b border-slate-100 py-3">
                        <div>
                            <span class="text-slate-400 block text-[10px] uppercase tracking-wider">Grado</span>
                            <span id="badge-grado" class="font-bold text-slate-700 text-base">OSS</span>
                        </div>
                        <div class="text-right">
                            <span class="text-slate-400 block text-[10px] uppercase tracking-wider">ID Matricola</span>
                            <span id="badge-codice" class="font-mono font-bold text-teal-700 text-base">000000</span>
                        </div>
                    </div>

                    <div class="flex justify-center py-2 bg-slate-50 rounded-xl border border-slate-100">
                        <canvas id="badge-barcode"></canvas>
                    </div>
                </div>

                <div class="bg-slate-100 p-3 text-center border-t border-slate-200">
                    <p class="text-[10px] font-medium text-slate-400 uppercase tracking-wide">Documento interno non cedibile a terzi</p>
                </div>
            </div>
            </div>
            <br>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <label class="text-sm font-bold text-slate-600">Formato Codice:</label>
                    <select id="barcode-type" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-xl bg-slate-50 outline-none focus:ring-2 focus:ring-teal-600">
                        <option value="azteccode">Aztec</option>
                        <option value="pdf417">PDF417</option>
                    </select>
                </div>
                <button id="btn-download" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                    <span>⬇️</span> Scarica Badge (PNG)
                </button>
            </div>

        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDYcwhZdpOkNOJwt_2oIBGIDED4y7fVVm0",
            authDomain: "staff-operatori-mg.firebaseapp.com",
            projectId: "staff-operatori-mg",
            storageBucket: "staff-operatori-mg.firebasestorage.app",
            messagingSenderId: "797244866930",
            appId: "1:797244866930:web:b93ca19a318711f8b89deb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const FIRESTORE_COLLECTION = "operatori";

        // Riferimenti DOM
        const inputCodice = document.getElementById('input-codice');
        const btnCerca = document.getElementById('btn-cerca');
        const searchStatus = document.getElementById('search-status');
        
        const badgeSection = document.getElementById('badge-section');
        const badgeNome = document.getElementById('badge-nome');
        const badgeMansione = document.getElementById('badge-mansione');
        const badgeGrado = document.getElementById('badge-grado');
        const badgeCodice = document.getElementById('badge-codice');
        
        const barcodeType = document.getElementById('barcode-type');
        const btnDownload = document.getElementById('btn-download');

        let currentCode = null;

        // Funzione per mostrare messaggi di stato
        function showStatus(message, isError = false) {
            searchStatus.textContent = message;
            searchStatus.classList.remove('hidden', 'text-slate-500', 'text-rose-600', 'text-emerald-600');
            searchStatus.classList.add(isError ? 'text-rose-600' : 'text-emerald-600');
        }

        // Generazione del Codice a Barre
        function generaBarcode() {
            if (!currentCode) return;
            try {
                bwipjs.toCanvas('badge-barcode', {
                    bcid: barcodeType.value, // 'azteccode' o 'pdf417'
                    text: currentCode,
                    scale: barcodeType.value === 'azteccode' ? 4 : 3, // Aztec rende meglio se leggermente più grande
                    height: barcodeType.value === 'pdf417' ? 10 : 12,
                    includetext: false,
                    backgroundcolor: 'f8fafc' // Colore bg-slate-50 di tailwind
                });
            } catch (e) {
                console.error("Errore generazione barcode:", e);
                showStatus("Errore nel rendering del codice a barre.", true);
            }
        }

        // Ricerca Operatore
        btnCerca.addEventListener('click', async () => {
            const codice = inputCodice.value.trim();
            badgeSection.classList.add('hidden');
            
            if (!codice) {
                showStatus("Inserisci un codice matricola.", true);
                return;
            }

            searchStatus.textContent = "Ricerca nel database...";
            searchStatus.classList.remove('hidden');
            searchStatus.className = "text-sm mt-3 font-medium text-center text-slate-500";

            try {
                const docRef = doc(db, FIRESTORE_COLLECTION, codice);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentCode = codice;
                    
                    // Popola i dati
                    badgeNome.textContent = data.fullname || "Nome Non Inserito";
                    badgeMansione.textContent = data.mansione || "Nessuna mansione";
                    badgeGrado.textContent = data.grado || "N/D";
                    badgeCodice.textContent = codice;

                    showStatus("Operatore trovato!", false);
                    badgeSection.classList.remove('hidden');
                    generaBarcode();

                } else {
                    showStatus("Nessun operatore trovato con questo codice.", true);
                }
            } catch (error) {
                console.error(error);
                showStatus("Errore di connessione a Firebase.", true);
            }
        });

        // Aggiorna il codice a barre quando si cambia dal menu a tendina
        barcodeType.addEventListener('change', generaBarcode);

        // Download Immagine
        btnDownload.addEventListener('click', () => {
            const element = document.getElementById('badge-card-export');
            
            // Applica uno scaling alto per migliorare la qualità del testo e del codice a barre scaricato
            html2canvas(element, { 
                scale: 4, 
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Badge_${currentCode}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        });

        // Consenti la ricerca premendo INVIO
        inputCodice.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnCerca.click();
            }
        });

    </script>
</body>
</html>
