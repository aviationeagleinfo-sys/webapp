<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Riservato - drgiuseppemusumeci.com</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            border-top: 5px solid #0056b3; /* Richiamo all'ambito medico/istituzionale */
        }

        .icon {
            font-size: 48px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        p {
            font-size: 15px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin-bottom: 20px;
        }

        .footer {
            font-size: 13px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Icona di blocco/avviso -->
        <div class="icon">🔒</div>
        
        <!-- Messaggio principale richiesto -->
        <h1>Questo sottodominio è riservato</h1>
        
        <p>L'accesso a questa sezione della piattaforma è limitato al personale autorizzato o a configurazioni di sistema interne.</p>
        
        <div class="divider"></div>
        
        <!-- Informazioni sul dominio principale -->
        <div class="footer">
            Tutti i diritti riservati.
        </div>
    </div>

</body>
</html>
