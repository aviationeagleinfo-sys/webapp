<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Giuseppe Musumeci</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="https://webapp.drgiuseppemusumeci.com/favicon.ico">
  <meta name="theme-color" content="#0056b3">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "f65ebf35-3fc6-4a9b-abae-29266ce4cd37",
      });
    });
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }

    /* Stile per i moduli dell'App con effetto Glassmorphism sfumato */
    .app-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.05);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .native-login input {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
    }

    .btn-primary { background-color: #0056b3; color: white; }
    .btn-google { background-color: #db4437; color: white; }
    .btn-facebook { background-color: #4267B2; color: white; }
    .btn-signout { background-color: #e0e0e0; color: #333; }

    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .news-item {
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      padding: 15px 0;
    }
    .news-item:last-child { border-bottom: none; }
    .news-item h4 { margin: 0 0 8px 0; color: #0056b3; }
    .news-item p { margin: 0 0 8px 0; font-size: 14px; line-height: 1.4; }
    .news-item small { color: #888; }

    /* Popup di Installazione Stile Glassmorphism */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
      padding: 15px 25px;
      border-radius: 16px;
      z-index: 9999;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 450px;
    }
    #pwa-install-banner img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }
    #pwa-install-banner .text {
      color: #333;
      font-size: 13px;
    }
    #pwa-install-banner button {
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #pwa-install-banner .btn-install { background-color: #0056b3; color: white; }
    #pwa-install-banner .btn-close { background-color: transparent; color: #666; }
  </style>
</head>
<body>

  <h1>Area Sanitaria — Dr. Giuseppe Musumeci</h1>

  <div class="app-card" id="auth-container">
    <h3>Accesso Piattaforma</h3>
    
    <div id="user-info" style="display: none;">
      <p>Account attivo: <strong id="user-name"></strong></p>
      <button class="btn btn-signout" id="btnSignOut">Disconnetti</button>
    </div>
    
    <div id="auth-forms">
      <div class="native-login">
        <input type="email" id="loginEmail" placeholder="Indirizzo Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button class="btn btn-primary" id="btnEmailLogin">Accedi</button>
      </div>
      <div class="social-grid">
        <button class="btn btn-google" id="btnGoogleLogin">Google</button>
        <button class="btn btn-facebook" id="btnFacebookLogin">Facebook</button>
      </div>
    </div>
  </div>

  <div class="app-card">
    <h3>Ultime Notizie & Comunicazioni</h3>
    <div id="news-list">Verifica degli aggiornamenti in corso...</div>
  </div>

  <div id="pwa-install-banner">
    <img src="https://webapp.drgiuseppemusumeci.com/favicon.ico" alt="Logo">
    <div class="text">Installa l'app del Dr. Musumeci per ricevere le notifiche e usarla offline.</div>
    <button class="btn-install" id="btnPwaInstall">Installa</button>
    <button class="btn-close" id="btnPwaClose">Annulla</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      FacebookAuthProvider, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      initializeFirestore, 
      enableIndexedDbPersistence, 
      collection, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Nuova configurazione Firebase ufficiale associata all'app 'giuseppe-4c318'
    const firebaseConfig = {
      apiKey: "AIzaSyCt6Ti-xk-_7j-CI_MLILkjj6fJem9VPOY",
      authDomain: "giuseppe-4c318.firebaseapp.com",
      databaseURL: "https://giuseppe-4c318-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "giuseppe-4c318",
      storageBucket: "giuseppe-4c318.firebasestorage.app",
      messagingSenderId: "658885311131",
      appId: "1:658885311131:web:9bb26a19cec41dd331e43e",
      measurementId: "G-T740SVWJ06"
    };

    // Inizializzazione moduli e analisi
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { localCache: true });

    // Attivazione cache IndexedDB per l'archiviazione dati locale in assenza di rete
    enableIndexedDbPersistence(db).catch((err) => {
      console.warn("Stato persistenza offline database:", err.code);
    });

    // --- SISTEMA DI AUTENTICAZIONE UTENTE ---
    const googleProvider = new GoogleAuthProvider();
    const facebookProvider = new FacebookAuthProvider();

    const authForms = document.getElementById('auth-forms');
    const userInfo = document.getElementById('user-info');
    const userName = document.getElementById('user-name');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authForms.style.display = 'none';
        userInfo.style.display = 'block';
        userName.textContent = user.displayName || user.email;
      } else {
        authForms.style.display = 'block';
        userInfo.style.display = 'none';
      }
    });

    document.getElementById('btnGoogleLogin').addEventListener('click', () => {
      signInWithPopup(auth, googleProvider).catch(err => console.error("Autenticazione Google fallita:", err));
    });

    document.getElementById('btnFacebookLogin').addEventListener('click', () => {
      signInWithPopup(auth, facebookProvider).catch(err => console.error("Autenticazione Facebook fallita:", err));
    });

    document.getElementById('btnEmailLogin').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      if(email && pass) {
        signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Errore di accesso nativo: " + err.message));
      }
    });

    document.getElementById('btnSignOut').addEventListener('click', () => {
      signOut(auth);
    });

    // --- PIPELINE DI SINCRONIZZAZIONE NEWS (Firestore Real-time) ---
    const newsList = document.getElementById('news-list');
    const newsQuery = query(collection(db, "news"), orderBy("date", "desc"));

    onSnapshot(newsQuery, (snapshot) => {
      if (snapshot.empty) {
        newsList.innerHTML = "<p>Nessun aggiornamento o comunicazione inserita.</p>";
        return;
      }

      let html = "";
      snapshot.forEach((doc) => {
        const newsData = doc.data();
        const formattedDate = newsData.date ? new Date(newsData.date.seconds * 1000).toLocaleDateString('it-IT') : 'Data non specificata';
        html += `
          <div class="news-item">
            <h4>${newsData.title || 'Comunicazione'}</h4>
            <p>${newsData.content || ''}</p>
            <small>Pubblicato il: ${formattedDate}</small>
          </div>
        `;
      });
      newsList.innerHTML = html;
    }, (error) => {
      console.error("Errore flusso Firestore:", error);
      newsList.innerHTML = "<p>Servizio temporaneamente non disponibile offline.</p>";
    });

    // --- LOGICA DI GESTIONE POPUP INSTALLAZIONE PWA ---
    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const btnInstall = document.getElementById('btnPwaInstall');
    const btnClose = document.getElementById('btnPwaClose');

    window.addEventListener('beforeinstallprompt', (e) => {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) return;

      e.preventDefault();
      deferredPrompt = e;
      
      if (installBanner) {
        installBanner.style.display = 'flex';
      }
    });

    if (btnInstall) {
      btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Riscontro utente installazione: ${outcome}`);
          deferredPrompt = null;
          installBanner.style.display = 'none';
        }
      });
    }

    if (btnClose) {
      btnClose.addEventListener('click', () => {
        installBanner.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBanner) installBanner.style.display = 'none';
      console.log('Installazione completata con successo.');
    });

    // Registrazione dell'ambiente Service Worker principale
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker agganciato allo scope:', reg.scope))
          .catch(err => console.error('Fallimento Service Worker:', err));
      });
    }

    export { db };
  </script>
</body>
</html>
