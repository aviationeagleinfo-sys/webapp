<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Giuseppe Musumeci</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/x-icon" href="https://webapp.drgiuseppemusumeci.com/favicon.ico">
  <meta name="theme-color" content="#0056b3">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "f65ebf35-3fc6-4a9b-abae-29266ce4cd37",
      });
    });
  </script>

  <style>
    /* Popup di Installazione Stile Glassmorphism */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
      padding: 15px 25px;
      border-radius: 16px;
      z-index: 9999;
      font-family: sans-serif;
      align-items: center;
      gap: 15px;
    }
    #pwa-install-banner img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }
    #pwa-install-banner .text {
      color: #333;
      font-size: 14px;
    }
    #pwa-install-banner button {
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #pwa-install-banner .btn-install {
      background-color: #0056b3;
      color: white;
    }
    #pwa-install-banner .btn-close {
      background-color: transparent;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Sito Web Dr. Giuseppe Musumeci</h1>

  <div id="pwa-install-banner">
    <img src="https://webapp.drgiuseppemusumeci.com/favicon.ico" alt="Logo">
    <div class="text">Installa l'app del Dr. Musumeci sul tuo dispositivo per un accesso rapido anche offline.</div>
    <button class="btn-install" id="btnPwaInstall">Installa</button>
    <button class="btn-close" id="btnPwaClose">No, grazie</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeFirestore, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Inizializzazione Firebase 'staff-operatori-mg'
    const firebaseConfig = {
      apiKey: "AIzaSyDYcwhZdpOkNOJwt_2oIBGIDED4y7fVVm0",
      authDomain: "staff-operatori-mg.firebaseapp.com",
      projectId: "staff-operatori-mg",
      storageBucket: "staff-operatori-mg.firebasestorage.app",
      messagingSenderId: "797244866930",
      appId: "1:797244866930:web:c15c3810bf4a6ebeb89deb"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { localCache: true });

    // Abilita la persistenza dei dati offline
    enableIndexedDbPersistence(db).catch((err) => {
      console.warn("Stato persistenza offline:", err.code);
    });

    // Gestione del Popup di Installazione
    let deferredPrompt;
    const installBanner = document.getElementById('pwa-install-banner');
    const btnInstall = document.getElementById('btnPwaInstall');
    const btnClose = document.getElementById('btnPwaClose');

    window.addEventListener('beforeinstallprompt', (e) => {
      // Se l'app è già avviata standalone, esce
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) return;

      e.preventDefault();
      deferredPrompt = e;
      
      if (installBanner) {
        installBanner.style.display = 'flex';
      }
    });

    if (btnInstall) {
      btnInstall.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log(`Risposta installazione: ${outcome}`);
          deferredPrompt = null;
          installBanner.style.display = 'none';
        }
      });
    }

    if (btnClose) {
      btnClose.addEventListener('click', () => {
        installBanner.style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBanner) installBanner.style.display = 'none';
      console.log('Applicazione installata con successo sulla home.');
    });

    // Registrazione del Service Worker principale
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registrato su:', reg.scope))
          .catch(err => console.error('Errore Service Worker:', err));
      });
    }

    export { db };
  </script>
</body>
</html>
